<div class="grid gap-5 border-t border-line px-5 py-5">
  <div class="grid gap-2">
    <p id="drawer-theme-label" class="field-label">Theme</p>
    <div class="segmented" role="group" aria-labelledby="drawer-theme-label">
      <button type="button" class="segmented-option" data-theme-option="light" aria-pressed="false" aria-label="Light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      </button>
      <button type="button" class="segmented-option" data-theme-option="dark" aria-pressed="false" aria-label="Dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
    </div>
  </div>
  <div class="grid gap-2">
    <p id="drawer-dir-label" class="field-label">Text direction</p>
    <div class="segmented" role="group" aria-labelledby="drawer-dir-label">
      <button type="button" class="segmented-option" data-dir-option="ltr" aria-pressed="false">LTR</button>
      <button type="button" class="segmented-option" data-dir-option="rtl" aria-pressed="false">RTL</button>
    </div>
  </div>
</div>
